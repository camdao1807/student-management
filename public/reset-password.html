<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đặt lại mật khẩu - SM University</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f8fafc; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#0f172a; }
  .box { width:100%; max-width:400px; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:32px; margin:16px; }
  h2 { margin:0 0 4px; } .sub { color:#64748b; margin-bottom:20px; font-size:14px; }
  label { display:block; font-size:13px; color:#64748b; margin:14px 0 4px; }
  input { width:100%; padding:11px 12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; }
  button { width:100%; margin-top:20px; padding:12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-size:15px; cursor:pointer; }
  .msg { padding:10px 12px; border-radius:10px; font-size:13px; margin-top:14px; display:none; }
  .ok { background:#dcfce7; color:#166534; } .bad { background:#fee2e2; color:#b91c1c; }
  a { color:#2563eb; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<form class="box" id="f">
  <h2>Đặt mật khẩu mới</h2>
  <div class="sub">Mật khẩu tối thiểu 6 ký tự.</div>
  <label>Mật khẩu mới</label><input id="pw" type="password" minlength="6" required autofocus />
  <label>Nhập lại mật khẩu</label><input id="pw2" type="password" minlength="6" required />
  <div class="msg" id="msg"></div>
  <button>Đặt lại mật khẩu</button>
  <div style="text-align:center;margin-top:14px"><a href="login.html">← Quay lại đăng nhập</a></div>
</form>
<script>
  const token = new URLSearchParams(location.search).get('token');
  const msg = document.getElementById('msg');
  const show = (t, ok) => { msg.className = 'msg ' + (ok ? 'ok' : 'bad'); msg.textContent = t; msg.style.display = 'block'; };
  if (!token) show('Liên kết không hợp lệ.', false);

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!token) return;
    if (pw.value !== pw2.value) return show('Hai mật khẩu không khớp', false);
    const res = await fetch('/auth/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, newPassword: pw.value }),
    });
    const d = await res.json();
    if (res.ok) { show(d.message + '. Đang chuyển về trang đăng nhập...', true); setTimeout(() => (location.href = 'login.html'), 1500); }
    else show(Array.isArray(d.message) ? d.message.join(', ') : d.message, false);
  });
</script>
</body>
</html>
