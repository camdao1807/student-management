<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập - SM University</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f8fafc; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#0f172a; }
  .box { width:100%; max-width:400px; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:32px; margin:16px; }
  .brand { display:flex; gap:10px; align-items:center; margin-bottom:24px; }
  .logo { width:44px; height:44px; border-radius:10px; background:#2563eb; color:#fff; display:grid; place-items:center; font-weight:700; }
  .brand small { color:#64748b; display:block; }
  h2 { margin:0 0 4px; } .sub { color:#64748b; margin-bottom:20px; font-size:14px; }
  label { display:block; font-size:13px; color:#64748b; margin:14px 0 4px; }
  input { width:100%; padding:11px 12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; }
  input:focus { outline:2px solid #bfdbfe; border-color:#2563eb; }

  /* Ô mật khẩu có nút ẩn / hiện */
  .pw { position:relative; }
  .pw input { padding-right:44px; }
  .pw .eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); width:34px; height:34px; margin:0; padding:0; border:0; border-radius:8px; background:transparent; color:#64748b; cursor:pointer; display:grid; place-items:center; }
  .pw .eye:hover { background:#f1f5f9; color:#2563eb; }
  .pw .eye svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .pw .eye .off { display:none; }
  .pw .eye.on .off { display:block; }
  .pw .eye.on .show { display:none; }

  #btn { width:100%; margin-top:20px; padding:12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-size:15px; cursor:pointer; }
  #btn:hover { background:#1d4ed8; }
  #btn:disabled { opacity:.6; cursor:wait; }
  .err { background:#fee2e2; color:#b91c1c; padding:10px 12px; border-radius:10px; font-size:13px; margin-top:14px; display:none; }
</style>
</head>
<body>
<form class="box" id="f">
  <div class="brand"><div class="logo">SM</div><div><b>SM UNIVERSITY</b><small>QL SINH VIÊN</small></div></div>
  <h2>Đăng nhập</h2>
  <div class="sub">Dành cho quản trị viên, nhân viên, cố vấn và sinh viên.</div>

  <label for="username">Tên đăng nhập (mã SV / NV / CVHT)</label>
  <input id="username" autocomplete="username" autofocus required />

  <label for="password">Mật khẩu</label>
  <div class="pw">
    <input id="password" type="password" autocomplete="current-password" required />
    <button type="button" class="eye" id="togglePw" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
      <svg class="show" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-6 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.7 9.7 0 0 1 12 5c6 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
  </div>

  <div class="err" id="err"></div>
  <button id="btn">Đăng nhập</button>
  <div style="text-align:center;margin-top:14px;font-size:14px"><a href="forgot-password.html" style="color:#2563eb;text-decoration:none">Quên mật khẩu?</a></div>
</form>

<script src="/auth.js"></script>
<script>
  // Vào /login.html?logout=1 để xóa phiên cũ (khi bị kẹt)
  if (new URLSearchParams(location.search).has('logout')) {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
  }
  // Đã đăng nhập hợp lệ thì vào thẳng trang chính
  const u0 = Auth.user();
  const KNOWN_ROLES = ['admin', 'staff', 'advisor', 'student'];
  if (Auth.token() && u0 && KNOWN_ROLES.includes(u0.role)) location.href = Auth.home(u0.role);

  // Ẩn / hiện mật khẩu
  const pw = document.getElementById('password');
  const eye = document.getElementById('togglePw');
  eye.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    const label = show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu';
    eye.setAttribute('aria-label', label);
    eye.title = label;
    pw.focus();
  });

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn'), err = document.getElementById('err');
    err.style.display = 'none'; btn.disabled = true;
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: pw.value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(Array.isArray(data.message) ? data.message.join(', ') : data.message);
      Auth.save(data);
      location.href = Auth.home(data.user.role);
    } catch (ex) {
      err.textContent = ex.message || 'Không đăng nhập được';
      err.style.display = 'block';
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
