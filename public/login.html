<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Đăng nhập - SM University</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f8fafc; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#0f172a; }
  .box { width:100%; max-width:400px; background:#fff; border:1px solid #e2e8f0; border-radius:16px; padding:32px; margin:16px; }
  .brand { display:flex; gap:10px; align-items:center; margin-bottom:24px; }
  .logo { width:44px; height:44px; border-radius:10px; background:#2563eb; color:#fff; display:grid; place-items:center; font-weight:700; }
  .brand small { color:#64748b; display:block; }
  h2 { margin:0 0 4px; } .sub { color:#64748b; margin-bottom:20px; font-size:14px; }
  label { display:block; font-size:13px; color:#64748b; margin:14px 0 4px; }
  input { width:100%; padding:11px 12px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; }
  input:focus { outline:2px solid #bfdbfe; border-color:#2563eb; }
  button { width:100%; margin-top:20px; padding:12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .err { background:#fee2e2; color:#b91c1c; padding:10px 12px; border-radius:10px; font-size:13px; margin-top:14px; display:none; }
</style>
</head>
<body>
<form class="box" id="f">
  <div class="brand"><div class="logo">SM</div><div><b>SM UNIVERSITY</b><small>QL SINH VIÊN</small></div></div>
  <h2>Đăng nhập</h2>
  <div class="sub">Dành cho quản trị viên, nhân viên, cố vấn và sinh viên.</div>
  <label>Tên đăng nhập (mã SV / NV / CVHT)</label>
  <input id="username" autocomplete="username" autofocus required />
  <label>Mật khẩu</label>
  <input id="password" type="password" autocomplete="current-password" required />
  <div class="err" id="err"></div>
  <button id="btn">Đăng nhập</button>
  <div style="text-align:center;margin-top:14px;font-size:14px"><a href="forgot-password.html" style="color:#2563eb;text-decoration:none">Quên mật khẩu?</a></div>
</form>
<script src="auth.js"></script>
<script>
  const u0 = Auth.user();
  if (Auth.token() && u0) location.href = Auth.home(u0.role);

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn'), err = document.getElementById('err');
    err.style.display = 'none'; btn.disabled = true;
    try {
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(Array.isArray(data.message) ? data.message.join(', ') : data.message);
      Auth.save(data);
      location.href = Auth.home(data.user.role);
    } catch (ex) {
      err.textContent = ex.message || 'Không đăng nhập được';
      err.style.display = 'block';
    } finally { btn.disabled = false; }
  });
</script>
</body>
</html>
